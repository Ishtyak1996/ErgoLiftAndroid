name: Build ErgoLift APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Check Android project files
        run: |
          test -f ErgoLiftAndroid/settings.gradle.kts
          test -f ErgoLiftAndroid/app/build.gradle.kts

      - name: Download official Google MediaPipe pose model
        working-directory: ErgoLiftAndroid
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' \
            --output app/src/main/assets/pose_landmarker_lite.task
          test "$(stat -c%s app/src/main/assets/pose_landmarker_lite.task)" -gt 1000000

      - name: Compile installable debug APK
        working-directory: ErgoLiftAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ErgoLift-Android-APK
          path: ErgoLiftAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
